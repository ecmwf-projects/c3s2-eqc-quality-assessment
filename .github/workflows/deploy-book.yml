name: deploy-book

on:
  push:
    branches:
    - main
  workflow_dispatch:

env:
  PRE_BUILD_DIR: "_pre_build"
  UV_LOCKED: "1"

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
    - run: make build-book PRE_BUILD_DIR=${{ env.PRE_BUILD_DIR }}
    - run: touch ${{ env.PRE_BUILD_DIR }}/_build/html/.nojekyll
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: gh-pages
        path: _gh-pages
    - name: Deploy to GitHub Pages
      run: scripts/deploy-gh-pages.sh _gh-pages . "Deploy book from ${{ github.sha }}" ${{ env.PRE_BUILD_DIR }}/_build/html
