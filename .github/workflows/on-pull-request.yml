name: on-pull-request
on:
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRE_BUILD_DIR: "_pre_build"
  PRE_BUILD_FLAGS: "--disclaimer"
  UV_LOCKED: "1"

# PRs from forks only run the checks and a test build whose output is discarded:
# they get a read-only token, and their code must never reach the jobs that can
# push to gh-pages or comment.
jobs:
  qa:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.summary.outputs.markdown }}
    defaults:
      run:
        shell: bash # sets pipefail, so `| tee` keeps the exit status of pre-commit
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - run: git fetch origin main
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version-file: uv.lock
    - name: Get Python version
      id: python
      run: echo "version=$(uv run python -c 'import platform; print(platform.python_version())')" >>"$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ steps.python.outputs.version }}-${{ hashFiles('.pre-commit-config.yaml') }}
    - name: QA on all files
      id: all
      run: uv run pre-commit run --show-diff-on-failure --color=always --all-files 2>&1 | tee "$RUNNER_TEMP/qa-all.log"
    - name: Manual QA on modified files
      if: ${{ !cancelled() && steps.all.conclusion != 'skipped' }}
      run: uv run pre-commit run --show-diff-on-failure --color=always --hook-stage manual --from-ref origin/main --to-ref HEAD 2>&1 | tee "$RUNNER_TEMP/qa-changed.log"
    - name: Summarise
      id: summary
      if: ${{ !cancelled() && steps.all.conclusion != 'skipped' }}
      run: |
        python3 .github/scripts/qa-summary.py "All files=$RUNNER_TEMP/qa-all.log" "Changed files=$RUNNER_TEMP/qa-changed.log" >"$RUNNER_TEMP/qa-summary.md"
        cat "$RUNNER_TEMP/qa-summary.md" >>"$GITHUB_STEP_SUMMARY"
        delimiter=$(openssl rand -hex 16)
        {
            echo "markdown<<$delimiter"
            cat "$RUNNER_TEMP/qa-summary.md"
            echo "$delimiter"
        } >>"$GITHUB_OUTPUT"

  # The summary is built from the output of PR code, so it is only ever passed on as data
  comment-qa:
    if: ${{ !cancelled() && needs.qa.outputs.summary != '' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}
    needs: qa
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: .github/scripts
    - name: Comment PR
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.number }}
        QA_RESULT: ${{ needs.qa.result }}
        SUMMARY: ${{ needs.qa.outputs.summary }}
      run: |
        # Start commenting when something fails; afterwards keep the comment current
        if [[ $QA_RESULT == failure ]]; then verb=upsert; else verb=update; fi
        .github/scripts/pr-comment.sh "$verb" qa "$SUMMARY"

  changed-notebooks:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      files: ${{ steps.changed-notebooks.outputs.files }}
    steps:
    - name: Get changed notebooks
      id: changed-notebooks
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.number }}
      run: |-
        delimiter=$(openssl rand -hex 16)
        {
            echo "files<<$delimiter"
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
                --jq '.[] | select(.status != "removed") | .filename | select(endswith(".ipynb") and (contains("\n") | not))'
            echo "$delimiter"
        } >>"$GITHUB_OUTPUT"

  build-preview:
    if: github.event.action != 'closed'
    needs: changed-notebooks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version-file: uv.lock
    - name: Remove notebooks the preview doesn't need
      env:
        CHANGED_NOTEBOOKS: ${{ needs.changed-notebooks.outputs.files }}
      run: uv run python .github/scripts/prune-notebooks.py
    - run: make build-book PRE_BUILD_DIR=${{ env.PRE_BUILD_DIR }} PRE_BUILD_FLAGS=${{ env.PRE_BUILD_FLAGS }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: needs.changed-notebooks.outputs.files != '' && github.event.pull_request.head.repo.full_name == github.repository
      with:
        name: preview
        path: ${{ env.PRE_BUILD_DIR }}/_build/html
        retention-days: 1

  deploy-preview:
    if: needs.changed-notebooks.outputs.files != '' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [changed-notebooks, build-preview]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: .github/scripts
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: gh-pages
        path: _gh-pages
        persist-credentials: true # the deploy script pushes to gh-pages
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: preview
        path: _preview
    - name: Deploy preview
      env:
        PR: ${{ github.event.number }}
      run: |
        .github/scripts/deploy-gh-pages.sh _gh-pages "pr-preview/pr-$PR" "Deploy preview for PR #$PR" _preview

  remove-preview:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: .github/scripts
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: gh-pages
        path: _gh-pages
        persist-credentials: true # the deploy script pushes to gh-pages
    - name: Remove preview
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.number }}
      run: |
        .github/scripts/deploy-gh-pages.sh _gh-pages "pr-preview/pr-$PR" "Remove preview for PR #$PR"
        .github/scripts/pr-comment.sh update previews "**Previews:** removed because the pull request was closed."
        .github/scripts/pr-comment.sh delete-legacy

  comment-pr:
    if: needs.changed-notebooks.outputs.files != '' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [changed-notebooks, deploy-preview]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: .github/scripts
    - name: Comment PR
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        CHANGED_NOTEBOOKS: ${{ needs.changed-notebooks.outputs.files }}
        PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      run: |
        permalinks="<ul>"
        previews="<ul>"
        while IFS= read -r file; do
            permalink="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$HEAD_SHA/${file//&/%26}"
            preview="$PAGES_URL/pr-preview/pr-$PR/${file%.ipynb}.html"
            permalinks+="<li><a href=\"$permalink\">$permalink</a></li>"
            previews+="<li><a href=\"$preview\">$preview</a></li>"
        done <<<"$CHANGED_NOTEBOOKS"
        .github/scripts/pr-comment.sh upsert permalinks "**Permalinks:**"$'\n'"$permalinks</ul>"
        .github/scripts/pr-comment.sh upsert previews "**Previews:**"$'\n'"$previews</ul>"
        .github/scripts/pr-comment.sh delete-legacy
