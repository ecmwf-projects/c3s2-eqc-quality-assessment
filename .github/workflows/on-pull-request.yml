name: on-pull-request
on:
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PRE_BUILD_DIR: "_pre_build"
  PRE_BUILD_FLAGS: "--disclaimer"
  UV_LOCKED: "1"

defaults:
  run:
    shell: bash -l {0}

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: git fetch origin main
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
    - name: QA on all files
      run: uv run pre-commit run --show-diff-on-failure --color=always --all-files
    - name: Manual QA on modified files
      run: uv run pre-commit run --show-diff-on-failure --color=always --hook-stage manual --from-ref origin/main --to-ref HEAD

  changed-notebooks:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      files: ${{ steps.changed-notebooks.outputs.files }}
    steps:
    - name: Get changed notebooks
      id: changed-notebooks
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        set -euo pipefail
        {
            echo "files<<EOF"
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.number }}/files" \
                --jq '.[] | select(.status != "removed") | .filename | select(endswith(".ipynb"))'
            echo EOF
        } >>"$GITHUB_OUTPUT"

  deploy-preview:
    if: github.event.action != 'closed'
    needs: changed-notebooks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
    - name: Remove untouched notebooks
      id: remove-untouched-notebooks
      env:
        ALL_CHANGED_FILES: ${{ needs.changed-notebooks.outputs.files }}
      run: |-
        for file in ${ALL_CHANGED_FILES}; do
            mv "$file" "$file".keep
        done
        find . -type f -name "*.ipynb" -not -path "./templates/*" -exec rm -f {} +
        for file in ${ALL_CHANGED_FILES}; do
            mv "$file".keep "$file"
        done
    - run: make build-book PRE_BUILD_DIR=${{ env.PRE_BUILD_DIR }} PRE_BUILD_FLAGS=${{ env.PRE_BUILD_FLAGS }}
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: needs.changed-notebooks.outputs.files != ''
      with:
        ref: gh-pages
        path: _gh-pages
    - name: Deploy preview
      if: needs.changed-notebooks.outputs.files != ''
      env:
        PR: ${{ github.event.number }}
      run: |
        .github/scripts/deploy-gh-pages.sh _gh-pages "pr-preview/pr-$PR" "Deploy preview for PR #$PR" "$PRE_BUILD_DIR/_build/html"

  remove-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: gh-pages
        path: _gh-pages
    - name: Remove preview
      env:
        PR: ${{ github.event.number }}
      run: |
        .github/scripts/deploy-gh-pages.sh _gh-pages "pr-preview/pr-$PR" "Remove preview for PR #$PR"

  comment-pr:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    needs: changed-notebooks
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Build URLs
      id: build-urls
      env:
        ALL_CHANGED_FILES: ${{ needs.changed-notebooks.outputs.files }}
      run: |-
        permalinks="<ul>"
        previews="<ul>"
        for fullfile in ${ALL_CHANGED_FILES}; do
            commit=$(git rev-list -1 HEAD "$fullfile")
            suffix="${fullfile//&/%26}"
            permalink=${{ github.server_url }}/${{ github.repository }}/blob/$commit/$suffix
            permalinks+="<li><a href=\"$permalink\">$permalink</a></li>"
            suffix="${fullfile/.ipynb/.html}"
            preview=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/$suffix
            previews+="<li><a href=\"$preview\">$preview</a></li>"
        done
        permalinks+="</ul>"
        echo "permalinks=$permalinks" >>"$GITHUB_OUTPUT"
        previews+="</ul>"
        echo "previews=$previews" >>"$GITHUB_OUTPUT"
    - name: Comment PR
      env:
        GH_TOKEN: ${{ github.token }}
        PR_COMMENTS: repos/${{ github.repository }}/issues/${{ github.event.number }}/comments
        PERMALINKS: ${{ steps.build-urls.outputs.permalinks }}
        PREVIEWS: ${{ steps.build-urls.outputs.previews }}
      run: |-
        set -euo pipefail
        # Create the comment tagged $1 or update it in place. The marker matches the
        # one used by thollander/actions-comment-pull-request, so existing comments are reused.
        comment() {
            local marker="<!-- thollander/actions-comment-pull-request \"$1\" -->"
            local body="$2"$'\n'"$marker"
            local id
            id=$(gh api --paginate "$PR_COMMENTS" | jq -rs --arg marker "$marker" \
                'add | map(select(.user.login == "github-actions[bot]" and (.body | contains($marker)))) | first | .id // empty')
            if [[ -n $id ]]; then
                gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
            else
                gh api "$PR_COMMENTS" -f body="$body" >/dev/null
            fi
        }
        comment permalinks "**Permalinks:**"$'\n'"$PERMALINKS"
        comment previews "**Previews:**"$'\n'"$PREVIEWS"
