name: dependabot-auto-merge

on:
  pull_request:
    types:
    - opened
    - reopened

permissions:
  contents: read

# Turns on auto-merge for minor and patch bumps of the GitHub Actions and pre-commit groups.
# GitHub then merges them once the required status checks pass, so this relies on
# branch protection requiring those checks. uv bumps and major bumps are left for review.
jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      id: metadata
    - name: Enable auto-merge
      if: >-
        contains(fromJSON('["github-actions", "pre-commit"]'), steps.metadata.outputs.dependency-group)
        && steps.metadata.outputs.update-type != 'version-update:semver-major'
      env:
        GH_TOKEN: ${{ github.token }}
        PR_URL: ${{ github.event.pull_request.html_url }}
      run: gh pr merge --auto --squash "$PR_URL"
