name: weekly

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"

defaults:
  run:
    shell: bash -l {0}

on:
  schedule:
  - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.2.0
    - name: Run autoupdate
      run: |
        uv run pre-commit autoupdate
    - name: Create Pull Request
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCH: pre-commit-autoupdate
      run: |
        set -euo pipefail
        if git diff --quiet; then
            echo "No updates"
            exit 0
        fi
        git switch -C "$BRANCH"
        git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qam "pre-commit autoupdate"
        git push --force origin "$BRANCH"
        if [[ -z $(gh pr list --head "$BRANCH" --json number --jq '.[].number') ]]; then
            gh pr create --head "$BRANCH" --title "pre-commit autoupdate" \
                --body "Automated \`pre-commit autoupdate\` by the weekly workflow."
        fi
    - uses: actions/cache@v6
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
    - name: Run all checks on all files
      timeout-minutes: 60
      run: uv run pre-commit run --show-diff-on-failure --color=always --all-files --hook-stage manual
