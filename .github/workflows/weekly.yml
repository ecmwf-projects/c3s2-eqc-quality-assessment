name: weekly

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_LOCKED: "1"

on:
  schedule:
  - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version-file: uv.lock
    - name: Run autoupdate
      run: |
        uv run pre-commit autoupdate
    - name: Create Pull Request
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCH: pre-commit-autoupdate
      run: |
        if git diff --quiet; then
            echo "No updates"
            exit 0
        fi
        git switch -C "$BRANCH"
        git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qam "pre-commit autoupdate"
        git push --force origin "$BRANCH"
        if [[ -z $(gh pr list --head "$BRANCH" --json number --jq '.[].number') ]]; then
            gh pr create --head "$BRANCH" --title "pre-commit autoupdate" \
                --body "Automated \`pre-commit autoupdate\` by the weekly workflow."
        fi
    - name: Get Python version
      id: python
      run: echo "version=$(uv run python -c 'import platform; print(platform.python_version())')" >>"$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ steps.python.outputs.version }}-${{ hashFiles('.pre-commit-config.yaml') }}
    - name: Run all checks on all files
      timeout-minutes: 60
      run: uv run pre-commit run --show-diff-on-failure --color=always --all-files --hook-stage manual
