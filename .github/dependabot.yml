version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  assignees:
  - figi44
  - PeterBoxall
  groups:
    github-actions:
      patterns:
      - "*"
- package-ecosystem: uv
  directory: /
  schedule:
    interval: weekly
  assignees:
  - figi44
  - PeterBoxall
  # Capped in pyproject.toml: jupyter-book 2 is a rewrite (#482), myst-nb 1.4 changes table formatting (#661)
  ignore:
  - dependency-name: jupyter-book
    versions:
    - ">=2"
  - dependency-name: myst-nb
    versions:
    - ">=1.4"
  groups:
    uv:
      patterns:
      - "*"
    uv-security:
      applies-to: security-updates
      patterns:
      - "*"
