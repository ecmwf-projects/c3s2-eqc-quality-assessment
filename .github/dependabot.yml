version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  assignees:
  - figi44
  - recmanj
  groups:
    github-actions:
      patterns:
      - "*"
- package-ecosystem: uv
  directory: /
  schedule:
    interval: weekly
  assignees:
  - figi44
  - recmanj
  # Capped in pyproject.toml until the migration to Jupyter Book 2 (#671) and the myst-nb table fix (#672)
  ignore:
  - dependency-name: jupyter-book
    versions:
    - ">=2"
  - dependency-name: myst-nb
    versions:
    - ">=1.4"
  groups:
    uv:
      patterns:
      - "*"
    uv-security:
      applies-to: security-updates
      patterns:
      - "*"
