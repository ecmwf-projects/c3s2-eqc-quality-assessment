version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  assignees:
  - figi44
  - PeterBoxall
  groups:
    github-actions:
      patterns:
      - "*"
- package-ecosystem: uv
  directory: /
  schedule:
    interval: weekly
  assignees:
  - figi44
  - PeterBoxall
  groups:
    uv:
      patterns:
      - "*"
    uv-security:
      applies-to: security-updates
      patterns:
      - "*"
