[dependency-groups]
book = [
  "jupyter-book<2.0.0",
  "myst-nb<1.4.0",
  "nbformat>=5.11.1",
  "sphinx-new-tab-link>=0.8.2"
]
check-links = [
  "lychee-bin>=0.24.2"
]
dev = [
  "pre-commit>=4.6.1"
]
uv = [
  "uv>=0.12.23"
]

[project]
dependencies = []
description = "C3S2 EQC Quality Assessment"
name = "c3s2-eqc-quality-assessment"
readme = "README.md"
requires-python = ">=3.14"
version = "0.1.0"

[tool.ruff]
indent-width = 4
# Same as Black.
line-length = 88

[tool.ruff.lint]
ignore = [
  # pydocstyle: Missing Docstrings
  "D1"
]
select = [
  # pyflakes
  "F",
  # pycodestyle
  "E",
  "W",
  # isort
  "I",
  # pydocstyle
  "D"
]

[tool.ruff.lint.pycodestyle]
max-line-length = 110

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.uv]
package = false
