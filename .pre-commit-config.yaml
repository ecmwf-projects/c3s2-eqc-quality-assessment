repos:
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.12.3
  hooks:
  - id: uv-lock
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
  - id: check-toml
    exclude: uv.lock
  - id: check-merge-conflict
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.2
  hooks:
  - id: ruff
    args: [--fix, --show-fixes]
    types_or: [python, pyi]
  - id: ruff-format
    types_or: [python, pyi]
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --preserve-quotes]
  - id: pretty-format-toml
    exclude: uv.lock
    args: [--autofix]
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v2.3.0
  hooks:
  - id: mypy
    args: [--strict, --ignore-missing-imports, --no-warn-return-any]
    additional_dependencies: [types-requests]
- repo: local
  hooks:
  - id: fix-markdown-strings
    name: fix markdown strings
    entry: python scripts/fix-markdown-strings.py
    language: python
    types: [jupyter]
    additional_dependencies: [nbformat]
- repo: local
  hooks:
  - id: validate-headings
    name: validate headings
    entry: python scripts/validate-headings.py
    language: python
    types: [jupyter]
    additional_dependencies: [nbformat]
- repo: local
  hooks:
  - id: validate-references
    name: validate references
    entry: python scripts/validate-references.py
    language: python
    types: [jupyter]
    additional_dependencies: [nbformat]
- repo: https://github.com/executablebooks/mdformat
  rev: 1.0.0
  hooks:
  - id: mdformat
    additional_dependencies:
    - mdformat-gfm
- repo: https://github.com/kynan/nbstripout
  rev: 0.9.1
  hooks:
  - id: nbstripout
    args: [--drop-empty-cells, --keep-count, --keep-output, --extra-keys, metadata.kernelspec]
- repo: local
  hooks:
  - id: validate-filenames
    name: validate filenames
    entry: python scripts/validate-filenames.py
    language: python
    types: [jupyter]
    exclude: ^(templates/|Applications/)
    additional_dependencies: [requests, requests-cache]
- repo: local
  hooks:
  - id: check-notebook-links
    name: check notebook links
    entry: pytest
    language: python
    types_or: [jupyter, markdown]
    additional_dependencies: ["pytest-check-links[cache]", "requests>=2.34.2"]
    require_serial: true
- repo: local
  hooks:
  - id: validate-dois
    name: validate DOIs
    entry: python scripts/validate-dois.py
    language: python
    types: [jupyter]
    additional_dependencies: [nbformat, requests, requests-cache]
    require_serial: true
